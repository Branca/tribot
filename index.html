<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcomic - A Jornada Épica - Página 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header-info {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .header-info span {
            color: #666;
            font-size: 1rem;
        }

        .header-info strong {
            color: #764ba2;
        }

        /* Main Content */
        main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .comic-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: auto auto auto;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .comic-panel {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            min-height: 250px;
            max-height: 400px;
        }

        .comic-panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .panel-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-size: 1.5rem;
            color: #333;
            font-weight: bold;
            overflow: hidden;
        }

        .comic-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Desktop layout */
        .comic-panel:nth-child(1) {
            grid-column: 1 / 4;
            grid-row: 1;
            max-height: 500px;
        }

        .comic-panel:nth-child(2) {
            grid-column: 1;
            grid-row: 2;
        }

        .comic-panel:nth-child(3) {
            grid-column: 2 / 4;
            grid-row: 2;
        }

        .comic-panel:nth-child(4) {
            grid-column: 1 / 4;
            grid-row: 3;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            padding: 2rem;
            margin: 0 auto;
            max-width: 1400px;
        }

        .page-btn {
            min-width: 45px;
            height: 45px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.9);
            color: #764ba2;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .page-btn:hover {
            background: #764ba2;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .page-btn.active {
            background: #764ba2;
            color: white;
            border-color: #764ba2;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .prev-btn,
        .next-btn {
            font-size: 1.3rem;
            padding: 0 0.5rem;
        }

        .page-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Footer */
        footer {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            margin-top: auto;
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 2rem;
        }

        .social-icons {
            display: flex;
            gap: 1.5rem;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            background: #764ba2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .social-icon:hover {
            transform: scale(1.1);
            background: #667eea;
        }

        .footer-info {
            text-align: center;
            color: #666;
        }

        .footer-info p {
            margin: 0.3rem 0;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .comic-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: auto;
            }

            header h1 {
                font-size: 2rem;
            }

            .comic-panel:nth-child(1) {
                grid-column: 1 / 3;
                grid-row: auto;
            }

            .comic-panel:nth-child(2) {
                grid-column: 1 / 2;
                grid-row: auto;
            }

            .comic-panel:nth-child(3) {
                grid-column: 2 / 3;
                grid-row: auto;
            }

            .comic-panel:nth-child(4) {
                grid-column: 1 / 3;
                grid-row: auto;
            }
        }

        @media (max-width: 640px) {
            .comic-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.5rem;
            }

            .header-info {
                flex-direction: column;
                gap: 0.5rem;
            }

            main {
                padding: 0 1rem;
            }

            .footer-content {
                flex-direction: column;
                text-align: center;
            }

            .comic-panel:nth-child(1),
            .comic-panel:nth-child(2),
            .comic-panel:nth-child(3),
            .comic-panel:nth-child(4) {
                grid-column: span 1;
                grid-row: span 1;
                aspect-ratio: 4/3;
            }

            .comic-panel {
                max-width: 500px;
                margin: 0 auto;
                width: 100%;
            }

            .pagination {
                gap: 0.3rem;
                padding: 1.5rem 1rem;
            }

            .page-btn {
                min-width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .prev-btn,
            .next-btn {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>A Jornada Épica</h1>
        <div class="header-info">
            <span><strong>Editora:</strong> Cosmic Comics</span>
            <span><strong>Autor:</strong> João Silva</span>
            <span><strong>Ilustrador:</strong> Maria Santos</span>
        </div>
    </header>

    <main>
        <div class="comic-grid">
            <div class="comic-panel">
                <img src="imagens/pagina1-quadro1.jpg" alt="Quadro 1" class="comic-image">
            </div>
            <div class="comic-panel">
                <img src="imagens/pagina1-quadro2.jpg" alt="Quadro 2" class="comic-image">
            </div>
            <div class="comic-panel">
                <img src="imagens/pagina1-quadro3.jpg" alt="Quadro 3" class="comic-image">
            </div>
            <div class="comic-panel">
                <img src="imagens/pagina1-quadro4.jpg" alt="Quadro 4" class="comic-image">
            </div>
        </div>
    </main>

    <nav class="pagination">
        <span class="page-btn prev-btn disabled">&lt;</span>
        <span class="page-btn page-number active">1</span>
        <a href="page2.html" class="page-btn page-number">2</a>
        <a href="page3.html" class="page-btn page-number">3</a>
        <a href="page4.html" class="page-btn page-number">4</a>
        <a href="page5.html" class="page-btn page-number">5</a>
        <a href="page2.html" class="page-btn next-btn">&gt;</a>
    </nav>

    <footer>
        <div class="footer-content">
            <div class="social-icons">
                <a href="#" class="social-icon" title="Instagram">IG</a>
                <a href="#" class="social-icon" title="Twitter">TW</a>
                <a href="#" class="social-icon" title="Facebook">FB</a>
                <a href="#" class="social-icon" title="Email">@</a>
            </div>
            <div class="footer-info">
                <p><strong>Contato:</strong> contato@jornada-epica.com</p>
                <p>&copy; 2026 Cosmic Comics. Todos os direitos reservados.</p>
                <p>Desenvolvido com HTML5 e CSS Grid</p>
            </div>
        </div>
    </footer>
</body>
</html>
